<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Operational delivery signal</title>
  <desc id="desc">A dark copper operations panel showing 99.9 percent system uptime, 60 percent faster recovery, 40 percent fewer deployment issues, and a delivery path from development through staging to production.</desc>

  <rect width="1200" height="340" fill="#0D1117"/>
  <rect x="1.5" y="1.5" width="1197" height="337" fill="none" stroke="#30363D" stroke-width="3"/>
  <rect x="24" y="24" width="6" height="6" fill="#C4775A"/>
  <rect x="38" y="24" width="6" height="6" fill="#694237"/>
  <rect x="52" y="24" width="6" height="6" fill="#694237"/>

  <g font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">
    <text x="78" y="33" fill="#F2D0C4" font-size="15" font-weight="700" letter-spacing="2.4">OPERATIONAL SIGNAL</text>
    <text x="1174" y="33" fill="#8B949E" font-size="13" text-anchor="end" letter-spacing="1.5">AI-ASSISTED DELIVERY / MANILA</text>
    <line x1="24" y1="51" x2="1176" y2="51" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(24 78)">
      <text x="0" y="0" fill="#8B949E" font-size="13" letter-spacing="1.8">RELIABILITY</text>
      <text x="0" y="58" fill="#E69A78" font-size="56" font-weight="700">99.9%</text>
      <text x="0" y="88" fill="#F2D0C4" font-size="15" letter-spacing="1.2">SYSTEM UPTIME</text>
      <path d="M0 108 H326" stroke="#694237" stroke-width="2"/>
      <path d="M0 108 H294" stroke="#C4775A" stroke-width="2"/>
    </g>

    <line x1="400" y1="77" x2="400" y2="200" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(436 78)">
      <text x="0" y="0" fill="#8B949E" font-size="13" letter-spacing="1.8">RECOVERY</text>
      <text x="0" y="58" fill="#E69A78" font-size="56" font-weight="700">−60%</text>
      <text x="0" y="88" fill="#F2D0C4" font-size="15" letter-spacing="1.2">MEAN TIME TO RECOVERY</text>
      <path d="M0 108 H326" stroke="#694237" stroke-width="2"/>
      <path d="M0 108 H196" stroke="#C4775A" stroke-width="2"/>
    </g>

    <line x1="800" y1="77" x2="800" y2="200" stroke="#30363D" stroke-width="2"/>

    <g transform="translate(836 78)">
      <text x="0" y="0" fill="#8B949E" font-size="13" letter-spacing="1.8">DELIVERY</text>
      <text x="0" y="58" fill="#E69A78" font-size="56" font-weight="700">−40%</text>
      <text x="0" y="88" fill="#F2D0C4" font-size="15" letter-spacing="1.2">DEPLOYMENT ISSUES</text>
      <path d="M0 108 H340" stroke="#694237" stroke-width="2"/>
      <path d="M0 108 H136" stroke="#C4775A" stroke-width="2"/>
    </g>

    <line x1="24" y1="224" x2="1176" y2="224" stroke="#30363D" stroke-width="2"/>
    <text x="24" y="256" fill="#8B949E" font-size="13" letter-spacing="1.8">DELIVERY PATH</text>

    <circle cx="190" cy="280" r="7" fill="#E69A78"/>
    <line x1="197" y1="280" x2="470" y2="280" stroke="#694237" stroke-width="3"/>
    <path d="M460 274 L470 280 L460 286" fill="none" stroke="#C4775A" stroke-width="3"/>
    <text x="190" y="312" fill="#F2D0C4" font-size="15" text-anchor="middle" letter-spacing="1.2">DEVELOPMENT</text>

    <circle cx="600" cy="280" r="7" fill="#E69A78"/>
    <line x1="607" y1="280" x2="880" y2="280" stroke="#694237" stroke-width="3"/>
    <path d="M870 274 L880 280 L870 286" fill="none" stroke="#C4775A" stroke-width="3"/>
    <text x="600" y="312" fill="#F2D0C4" font-size="15" text-anchor="middle" letter-spacing="1.2">STAGING</text>

    <circle cx="1010" cy="280" r="9" fill="none" stroke="#E69A78" stroke-width="3"/>
    <circle cx="1010" cy="280" r="3" fill="#F2D0C4"/>
    <text x="1010" y="312" fill="#F2D0C4" font-size="15" text-anchor="middle" letter-spacing="1.2">PRODUCTION</text>
  </g>
</svg>
